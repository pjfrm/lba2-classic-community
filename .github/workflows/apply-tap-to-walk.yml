# One-off helper for a fork. It builds a branch called tap-to-walk from the exact commit the change was
# made on (417ea9336b39adaeb10b9a35391966b88e2be43e), lays the changed files from tap-to-walk-files.zip
# (committed in the repository root) over it, pushes the branch, and starts the project's own
# "Release Android" workflow on it. Run it once from the Actions tab; the APKs come out of the
# "Release Android" run it starts, under Artifacts.
name: Apply tap to walk and build

on:
  workflow_dispatch:

permissions:
  contents: write # push the tap-to-walk branch
  actions: write # start "Release Android" on it

jobs:
  apply-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: 417ea9336b39adaeb10b9a35391966b88e2be43e
    steps:
      - name: Check out the fork with its history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build the tap-to-walk branch
        run: |
          set -euo pipefail
          test -f tap-to-walk-files.zip || { echo "::error::tap-to-walk-files.zip is not in the repository root"; exit 1; }
          git cat-file -e "$BASE^{commit}" || { echo "::error::The commit $BASE is not in this fork's history"; exit 1; }
          cp tap-to-walk-files.zip "$RUNNER_TEMP/files.zip"
          git config user.name "tap-to-walk"
          git config user.email "tap-to-walk@users.noreply.github.com"
          git checkout -q -b tap-to-walk "$BASE"
          unzip -q -o "$RUNNER_TEMP/files.zip"
          git add -A
          git status --short
          git commit -q -m "feat(android): tap to walk, with routes round obstacles"

      - name: Push the branch
        run: |
          git push --force origin tap-to-walk || {
            echo "::error::The branch could not be pushed. In your fork: Settings > Actions > General > Workflow permissions > Read and write permissions > Save, then run this workflow again."
            exit 1
          }

      - name: Start Release Android on that branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-android.yml --ref tap-to-walk
